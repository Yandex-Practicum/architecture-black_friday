name: mongo-sharding-repl

services:
  configSrv:
    image: mongo:latest
    command: ["--configsvr", "--replSet", "config_server", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - config_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  shard1-1:
    image: mongo:latest
    command: ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - shard1_1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  shard1-2:
    image: mongo:latest
    command: ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27019"]
    ports:
      - "27019:27019"
    volumes:
      - shard1_2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  shard1-3:
    image: mongo:latest
    command: ["--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27020"]
    ports:
      - "27020:27020"
    volumes:
      - shard1_3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27020", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  shard2-1:
    image: mongo:latest
    command: ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27021"]
    ports:
      - "27021:27021"
    volumes:
      - shard2_1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27021", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  shard2-2:
    image: mongo:latest
    command: ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27022"]
    ports:
      - "27022:27022"
    volumes:
      - shard2_2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27022", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  shard2-3:
    image: mongo:latest
    command: ["--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27023"]
    ports:
      - "27023:27023"
    volumes:
      - shard2_3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27023", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongos_router:
    image: mongo:latest
    command: ["mongos", "--configdb", "config_server/configSrv:27017", "--bind_ip_all", "--port", "27024"]
    ports:
      - "27024:27024"
    healthcheck:
      test: ["CMD", "mongosh", "--host", "localhost", "--port", "27024", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  pymongo_api:
    build:
      context: ./api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: "mongodb://mongos_router:27024"
      MONGODB_DATABASE_NAME: "somedb"

volumes:
  config_data:
  shard1_1_data:
  shard1_2_data:
  shard1_3_data:
  shard2_1_data:
  shard2_2_data:
  shard2_3_data:
