      retries: 10
      start_period: 10s



  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - configSrv
      - mongos_router
      - shard2
      - shard1
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"
      MONGODB_DATABASE_NAME: "somedb"
    networks:
      - app-network

volumes:
  config-data:
  shard1-data:
  shard2-data:
  shard3-data:
  shard4-data:
  shard5-data:
  shard6-data:

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
      - subnet: 173.17.0.0/16