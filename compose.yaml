services:
  mongodb1a:
    container_name: mongodb1a
    image: mongo:latest
    volumes:
      - mongodb1a_data_container:/data/db

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongodb1a
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongodb1a"
      MONGODB_DATABASE_NAME: "somedb"


volumes:
  mongodb1a_data_container:
