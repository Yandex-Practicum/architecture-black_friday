name: mongo-sharding

services:
  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"
      MONGODB_DATABASE_NAME: "somedb"

  configSrv:
    container_name: configSrv
    image: dh-mirror.gitverse.ru/mongo:latest
    command:
      [
        "--configsvr",
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017",
      ]
    volumes:
      - config-data:/data/db
    ports:
      - "27017:27017"

  shard1:
    container_name: shard1
    image: dh-mirror.gitverse.ru/mongo:latest
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard1_set",
        "--bind_ip_all",
        "--port",
        "27018",
      ]
    volumes:
      - shard1-data:/data/db
    ports:
      - "27018:27018"

  shard2:
    container_name: shard2
    image: dh-mirror.gitverse.ru/mongo:latest
    command:
      [
        "--shardsvr",
        "--replSet",
        "shard2_set",
        "--bind_ip_all",
        "--port",
        "27019",
      ]
    volumes:
      - shard2-data:/data/db
    ports:
      - "27019:27019"

  mongos_router:
    container_name: mongos_router
    image: dh-mirror.gitverse.ru/mongo:latest
    command:
      [
        "mongos",
        "--configdb",
        "config_server/configSrv:27017",
        "--bind_ip_all",
        "--port",
        "27020",
      ]
    depends_on:
      - configSrv
      - shard1
      - shard2
    ports:
      - "27020:27020"

volumes:
  config-data:
  shard1-data:
  shard2-data:
